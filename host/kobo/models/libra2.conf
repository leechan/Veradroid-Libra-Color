# SPDX-License-Identifier: GPL-3.0-or-later
# Kobo Libra 2 (N418): Freescale i.MX6 SoloLite (single-core Cortex-A9, NEON),
# Linux 4.1.15, 512 MB RAM (495 MB usable), 1264x1680 300 ppi e-ink panel,
# Elan Touchscreen (MT protocol B, raw X=0..1680 Y=0..1264 -> swap X/Y),
# gpio-keys (193 upper, 194 lower, 116 power), ComfortLight PRO (mxc_msp430 + lm3630a).
MODEL_ID=libra2
MODEL_NAME="Kobo Libra 2"
MODEL_CODE=N418
MODEL_SUB=libra2
PKG_NAME=Veradroid-Libra2
PRODUCT_ID=veradroid-kobo-libra2
KERNEL_SERIES=4.1
KERNEL_DEFAULT=4.1.15
SOC=imx6sll
CPU_CORE=cortex-a9
CPU_CORES=1
RAM_MB=512

# --- Kernel modules ---------------------------------------------------------
# 4.1.15 needs all of binder, ashmem (via the Kindle shim), zsmalloc/zram and
# the madvise helper loaded from kmod/$(uname -r).
BINDER_DEVNAME=binder
BINDER_KO=binder_linux.ko
BUILTIN_ASHMEM=0
BUILTIN_ZRAM=0
BUILTIN_FUSE=0
MADVISE_KO=kobo_madvise.ko

# Memory & swap (no kernel LMK on stock 4.1.15; rely on zram + userspace lmkd + AM proc limit)
ZRAM_MB=256
ZRAM_MAX_MB=256
SQUEEZE_MB=64
SWAPFILE_MB=0
VM_SWAPPINESS=100
VM_MIN_FREE_KB=4096
PROC_LIMIT=2
MAX_STARTING_BG=2
HEAP_START=8m
HEAP_GROWTH=96m
HEAP_SIZE=192m
HEAP_MINFREE=2m
HEAP_MAXFREE=8m
HEAP_TARGET_UTIL=0.75
DALVIK_GCTYPE=CMS
# Per-process WeRead ART overrides (applied only to com.tencent.weread.eink & :seg by libkobo_madvise.so)
WEREAD_GCTYPE=CMS
WEREAD_HEAP_MINFREE=4m
WEREAD_HEAP_MAXFREE=12m
WEREAD_HEAP_GROWTH=96m
ANDROID_LOW_RAM=true
READAHEAD_KB=128
LOOP_READAHEAD_KB=64
CACHE_DEDUP_S=30

# App AOT compilation on single-core Cortex-A9
APP_COMPILE=auto
COMPILE_CHARGING_ONLY=1
COMPILE_BATT_MIN=40
CPUFREQ_HISPEED_LOAD=75
CPUFREQ_TARGET_LOADS="65 396000:75 792000:80"
CPUFREQ_IO_IS_BUSY=1
CPUFREQ_MIN_SAMPLE_MS=20000
CPUFREQ_ABOVE_HISPEED_MS=20000
IO_SCHEDULER=deadline

# Display: 1264x1680 300 ppi i.MX6 SLL EPDC v2
# KFB_DIM=off skips the 8.1 MB /tmp/veradroid/kfb/fb2 dim page on 512 MB RAM.
# KFB_HZ=20 cuts single-core VSync wakeups by 33% with zero visual loss on e-ink.
LCD_DENSITY=300
FB_MTK=0
FB_COLOR=0
FB_DEPTH_LOCK=0
FBINK_MIN_VERSION=1.25.0
KFB_ANIM_MODE=0
KFB_ANIM_STEPS=8
KFB_FLASH=6
KFB_SETTLE=50
KFB_DITHER=0
KFB_PACE=1
KFB_GCN=0
KFB_NEWWIN=0
KFB_ECLIPSE=1
KFB_DARKCRUSH=36
KFB_HEAVY_FLASH=1
KFB_IMG_DITHER=1
KFB_SKIA_OPT=1
KFB_FONT_GAMMA=2
IDLE_CAP_MS=10000
IDLE_CAP_KHZ=792000
FL_TIMEOUT=0
KFB_HWC=1
KFB_HZ=20
KFB_DIM=off

# Touch & physical keys
TOUCH_SWAP_XY=1
TOUCH_FLIP_X=0
TOUCH_FLIP_Y=0
TOUCH_EDGE_PX=120
G_WINDOW=25
G_EDGE_LIGHT=1
G_EDGE_LIGHT_SWAP=0
PAGE_KEYS=gpio-keys
PAGE_KEYS_MAP=volume
PAGE_KEYS_SWAP=0
# Power (116) is part of gpio-keys on N418.
POWER_KEY_DEV=
KEY_NEXT_LONG=clear
KEY_PREV_LONG=back
KEY_LONG_MS=500

# Frontlight (sysfs-driven via kobo.sh)
FL_COLD=mxc_msp430.0
FL_WARM=lm3630a_led
FL_MAX=100
BATTERY_NODES="mc13892_bat battery"
CHARGER_NODES="mc13892_bat acpwr usbpwr"

# Network
WIFI_IF=wlan0
WIFI_MODULES="sdio_wifi_pwr 8723ds"
WIFI_PS_SUPPORTED=1
WIFI_PS=auto
WIFI_PS_DEFAULT=auto

# Power management
SUSPEND_VEE_WAIT=1
SUSPEND_TRUST_WAKE=0
SUSPEND_IRQ_NAMES="Power Hall PageUp PageDown"
SLEEP_WIFI_OFF=1
RTC_WAKEUP_PATHS="/sys/devices/platform/soc/2100000.aips-bus/21a8000.i2c/i2c-2/2-0032/rtc_ricoh619/power/wakeup /sys/devices/platform/soc/2000000.aips-bus/20cc000.snvs/20cc000.snvs:snvs-rtc-lp/power/wakeup"

# Full exit on return so /mnt/onboard has zero lingering loop/mounts for USB mass storage
RETURN_MODE=off
