# SPDX-License-Identifier: GPL-3.0-or-later
# Kobo Libra Colour (N428 / N428B): MediaTek MT8113T (2x Cortex-A53, 32-bit
# userspace), Linux 4.9.77, 1 GB RAM (965 MB usable), 1264x1680 Kaleido 3
# colour e-ink panel (300 ppi B/W, 150 ppi colour), MTK hwtcon framebuffer
# (32 bpp, 5056 bytes per line), Elan touchscreen (raw 1680x1264, raw X
# reversed), gpio-keys page keys 193/194 + rotation, bd71828-pwrkey power
# key, bd71827_bat battery, ComfortLight PRO (mxc_msp430 + lm3630a).
#
# Porting notes: https://github.com/kobolabs/Kobo-Reader (hw/mt8113-libraC_vision7)
# and docs/kobo-libra-colour-port.md in this repository.

# --- Identity ---------------------------------------------------------------
MODEL_ID=libracolour
MODEL_NAME="Kobo Libra Colour"
MODEL_CODE=N428
MODEL_SUB=libracolour
PKG_NAME=Veradroid-LibraColour
PRODUCT_ID=veradroid-kobo-libracolour
KERNEL_SERIES=4.9
KERNEL_DEFAULT=4.9.77

SOC=mt8113
CPU_CORE=cortex-a53
CPU_CORES=2
RAM_MB=1024

# --- Kernel modules ---------------------------------------------------------
# 4.9.77 ships ashmem, zram and a protocol-8 (64-bit) binder built in.
# Android 7 ARM needs protocol-7 binder, provided by the out-of-tree
# binder_linux.ko which registers a char device named binder32 (major 511).
BINDER_DEVNAME=binder32
BINDER_KO=binder_linux.ko
BUILTIN_ASHMEM=1
BUILTIN_ZRAM=1
BUILTIN_FUSE=1
FORCE_KOBO_SDCARD=1
MADVISE_KO=kobo_madvise.ko

# --- Memory & swap ----------------------------------------------------------
# 1 GB device: keep the proven 512 MB-era limits (the extra RAM simply removes
# pressure) and allow one more cached background process.
ZRAM_MB=256
ZRAM_MAX_MB=256
SQUEEZE_MB=64
SWAPFILE_MB=0
VM_SWAPPINESS=100
VM_MIN_FREE_KB=6144
PROC_LIMIT=4
MAX_STARTING_BG=4
HEAP_START=8m
HEAP_GROWTH=128m
HEAP_SIZE=256m
HEAP_MINFREE=2m
HEAP_MAXFREE=8m
HEAP_TARGET_UTIL=0.75
DALVIK_GCTYPE=CMS
# Per-process WeRead ART overrides (applied only to com.tencent.weread.eink & :seg)
WEREAD_GCTYPE=CMS
WEREAD_HEAP_MINFREE=4m
WEREAD_HEAP_MAXFREE=12m
WEREAD_HEAP_GROWTH=128m
ANDROID_LOW_RAM=false
READAHEAD_KB=128
LOOP_READAHEAD_KB=64
CACHE_DEDUP=0
CACHE_DEDUP_S=300

# --- CPU / I/O --------------------------------------------------------------
APP_COMPILE=auto
COMPILE_CHARGING_ONLY=0
COMPILE_BATT_MIN=20
# MTK uses the standard interactive governor; its OPP table differs from
# i.MX6SLL (396/792 MHz), so only generic tunables are set.
CPUFREQ_HISPEED_LOAD=65
CPUFREQ_TARGET_LOADS="80"
CPUFREQ_IO_IS_BUSY=1
CPUFREQ_MIN_SAMPLE_MS=10000
CPUFREQ_ABOVE_HISPEED_MS=10000
IO_SCHEDULER=deadline

# --- Display ----------------------------------------------------------------
# 1264x1680 Kaleido 3, MTK hwtcon, 32 bpp. The bridge emits an 8-bit grey
# picture (Android UI/apps in grayscale); FBInk >= 1.25.0-544 with Libra
# Colour support is REQUIRED to refresh the hwtcon panel.
LCD_DENSITY=300
FB_MTK=1
FB_COLOR=1
FB_DEPTH_LOCK=1
FBINK_MIN_VERSION=1.25.0
KFB_ANIM_MODE=0
KFB_ANIM_STEPS=6
KFB_FLASH=6
KFB_SETTLE=50
KFB_DITHER=0
KFB_PACE=1
KFB_GCN=0
KFB_NEWWIN=0
KFB_ECLIPSE=1
KFB_DARKCRUSH=36
KFB_HEAVY_FLASH=1
KFB_IMG_DITHER=1
KFB_SKIA_OPT=1
KFB_FONT_GAMMA=2
# 静止限频关掉：微信读书加载/排版往往发生在最后一次触摸 10 秒之后，
# 以前这时会被压到 1.5 GHz，正好卡在“打开一本书要等很久”的窗口里。
IDLE_CAP_MS=0
BOOST_MS=400
IDLE_CAP_KHZ=1500000
FL_TIMEOUT=0
KFB_HWC=1
KFB_HZ=30
KFB_DIM=off
# MTK hwtcon: use DU for touch scrolling instead of i.MX A2 (1-bit).
KFB_SCROLLWFM=du
# Extra saturation for flat launcher colours (Kaleido mutes large fills). 0 = off.
KFB_COLORBOOST=0
KFB_COLORBOOST_HOME=38

# --- Touch & physical keys --------------------------------------------------
# Elan raw 1680x1264 -> swap XY -> portrait 1264x1680. Libra Colour additionally
# reverses raw X (KOReader Kobo_monza: touch_mirrored_y); after --swap-xy that is
# a flip of the logical Y axis.
TOUCH_SWAP_XY=1
TOUCH_FLIP_X=0
TOUCH_FLIP_Y=1
TOUCH_EDGE_PX=96
TOUCH_EDGE_TOP_PX=180
G_WINDOW=25
G_EDGE_LIGHT=1
G_EDGE_LIGHT_SWAP=0
G_BACK_EXCLUDE=
# Two-stage bottom edge: first swipe up shows a BACK button, a second swipe or a tap on
# the button goes back (0 = the old immediate back on the first swipe).
G_BACK_REVEAL=0
G_BACK_REVEAL_MS=4000
PAGE_KEYS=gpio-keys
PAGE_KEYS_MAP=volume
PAGE_KEYS_SWAP=0
# Power (116) is on its own input device on N428, not inside gpio-keys.
POWER_KEY_DEV=bd71828-pwrkey
KEY_NEXT_LONG=clear
KEY_PREV_LONG=back
KEY_LONG_MS=500

# --- Frontlight / battery ---------------------------------------------------
FL_COLD=mxc_msp430.0
FL_WARM=lm3630a_led
FL_MAX=100
BATTERY_NODES="bd71827_bat bd71828_bat mc13892_bat battery"
CHARGER_NODES="bd71827_charger bd71828_charger bd71828-charger acpwr usbpwr"

# --- Network ----------------------------------------------------------------
# MTK combo Wi-Fi ships as wlan_drv_gen4m/wmt_chrdev_wifi/wmt_drv. Keep the
# radio up while awake, but power it down before deep suspend: after a long
# suspend the firmware often comes back stuck in SCANNING and never reassociates.
# Wake turns it back on through wifi_resume (with a hard recovery fallback).
WIFI_IF=wlan0
WIFI_MODULES=
WIFI_PS_SUPPORTED=0
WIFI_PS=off
WIFI_PS_DEFAULT=off

# --- Power management -------------------------------------------------------
# The i.MX EPDC 9 s VEE-rail wait does not exist on MTK. Wake IRQ names are
# board-specific, so trust the first mem resume as a real user wake instead of
# treating it as a spurious RTC wake and re-suspending.
SUSPEND_VEE_WAIT=0
SUSPEND_STATES="mem freeze"
SUSPEND_TRUST_WAKE=1
SUSPEND_IRQ_NAMES="Power Hall PageUp PageDown"
SLEEP_WIFI_OFF=1
RTC_WAKEUP_PATHS=""

# Full exit on return so /mnt/onboard has zero lingering loop/mounts for USB mass storage
RETURN_MODE=off
