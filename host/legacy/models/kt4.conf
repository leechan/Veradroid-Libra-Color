# Kindle 入门款 2019（10 代，jaeger / rex）：i.MX6SLL 单核 A9，4.1.15，512 MB，600x800 167 ppi，
# 触摸 cyttsp5 按亚马逊 defconfig 是协议 A（CYTTSP5_MT_A=y，此时原样交给 Android、没有全局手势）或 goodix gt9xx（协议 B），无翻页键。只写和 old-base.conf 不同的。
MODEL_ID=kt4
SOC=imx6sll
CPU_CORE=cortex-a9
CPU_CORES=1
RAM_MB=512
LCD_DENSITY=160           # 167 ppi：600x800 px = 600x800 dp（300 时只有 320x427 dp）
TOUCH_EDGE_PX=66          # 边缘手势条 10 mm（167 ppi）
KFB_FLASH=6               # 波形大概率是 4 位（没有 REAGL）
FL_COLD=bl
FL_WARM=none
KFB_DITHER=0              # KOReader：KT4 不支持硬件抖动（另外也不支持夜间波形）
