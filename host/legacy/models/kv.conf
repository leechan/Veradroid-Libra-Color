# Kindle Voyage（7 代，icewine，主板号 01A/01B/025/026/047/048）：i.MX6SL 单核 A9，3.0.35（COMPAT_BRK），软浮点 5.13，512 MB，1072x1448 300 ppi，cyttsp4 协议 B；
# PagePress 压感翻页键 = 输入设备 fsr_keypad（KEY_PAGEUP 104 / KEY_PAGEDOWN 109，驱动自己震动）。只写和 old-base.conf 不同的。
MODEL_ID=kv
SOC=imx6sl
CPU_CORE=cortex-a9
CPU_CORES=1
RAM_MB=512
KFB_DITHER=0
KFB_SETTLE=60
PAGE_KEYS=fsr_keypad      # 绑进 Android：104 → PAGE_UP（上一页），109 → PAGE_DOWN（下一页）
FL_COLD=max77696-bl       # /sys/class/backlight（KOReader 机型表）
FL_WARM=none
FL_LIPC0_DIM=1            # powerd 0 档仍亮，关灯另写 sysfs
PAGE_KEYS_ENABLE="fsrkeypadEnable fsrkeypadPrevEnable fsrkeypadNextEnable"   # deviced：Android 运行期间打开 PagePress，停止时恢复
