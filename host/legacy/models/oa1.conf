# Kindle Oasis 1（8 代，whisky / woody，主板号 078/079/07F）：i.MX6SL 单核 A9，3.0.35（duet 配置），512 MB − 4 MB EPDC，1072x1448，cyttsp4 协议 B。
# 翻页键在 GPL 源码里找不到；没有模拟器，全部未验证。只写和 old-base.conf 不同的。
MODEL_ID=oa1
SOC=imx6sl
CPU_CORE=cortex-a9
CPU_CORES=1
RAM_MB=512
KFB_DITHER=0
KFB_SETTLE=60
FL_COLD=max77696-bl       # /sys/class/backlight（KOReader 机型表）
FL_WARM=none
FL_LIPC0_DIM=1            # powerd 0 档仍亮，关灯另写 sysfs
