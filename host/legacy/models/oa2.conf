# Kindle Oasis 2（9 代，zelda）：i.MX7D 双核 A7（996/792 MHz，默认 interactive），4.1.15（5.16 内核没有 PID 命名空间），512 MB，1264x1680 300 ppi，
# cyttsp5 协议 B（带压力 / 接触面积），实体翻页键 gpio-keys。只写和 old-base.conf 不同的。
MODEL_ID=oa2
SOC=imx7d
CPU_CORE=cortex-a7
CPU_CORES=2
RAM_MB=512
COMPILE_CHARGING_ONLY=0   # 双核：dex2oat 仍是单线程（低内存），另一个核留给前台
KFB_SETTLE=40
PAGE_KEYS=gpio-keys
PAGE_KEYS_SWAP=1          # 设备树（imx7d-zelda.dts）里 "Page Back" 发 KEY_PAGEDOWN(109)、"Page Forward" 发 KEY_PAGEUP(104)：对调后 Forward = 下一页
FL_COLD=max77796-bl
FL_WARM=none
KFB_DITHER=0              # Zelda EPDC（i.MX7D + PxP）：硬件抖动会让整块刷成黑的（Oasis 3 用户“灰度最准一大片黑”；KO3 / Oasis 2 模拟器 16 级灰测试全 0）。epd.c 在 Zelda 上也一律不开
