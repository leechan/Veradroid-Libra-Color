# 所有老机型（legacy 包：3.0.35 和 4.1.15 内核，PW2 / PW3 / Voyage / Oasis 1 / PW4 / 入门款 2019 / Oasis 2 / Oasis 3）共用的一层。
# settings.sh 认出具体机型后先读这个，再读 models/<机型>.conf（只写和这里不同的）；用户的 settings.conf 最后读、优先。
# 
#
# 内存：这些内核都没有 lowmemorykiller（3.0 wario defconfig 没有，4.1 设备配置没有 CONFIG_ANDROID），后台应用只会堆到内核 OOM。
ZRAM_MB=256               # 3.0 用我们编的 staging zram，4.1 内核自带；memory.sh 按内存封顶（< 400 MB 时 160）
SWAPFILE_MB=auto          # 内存 < 400 MB 时 256 MB 交换文件（memory.sh）；写 0 会让只用共用层的 PW2 没有交换文件（模拟器实测）
VM_SWAPPINESS=100         # 先压匿名页进 zram，别扔 odex / apk 的代码页（再用就是读盘的主缺页）
VM_MIN_FREE_KB=4096       # 下限（只往上调）：PW3 内核默认已是 4160（模拟器实测）；换页时给 SDIO Wi-Fi 和 EPDC 的原子分配留余量
PROC_LIMIT=4              # ActivityManager 后台进程上限（2 缓存 + 2 空），没有 LMK 时唯一提前收后台的手段
MAX_STARTING_BG=2
# 预编译：多数老机型是单核 A9，speed 编一个大应用要几十分钟：充电时编，或者电池上电量 >= COMPILE_BATT_MIN（40 %）时编
# （0.8.8 以前是只在充电时编：只用电池的用户应用永远编不了）。双核的 Oasis 2 / 3 在机型文件里放开到 20 %。
COMPILE_BATT_MIN=40
APP_COMPILE=auto
COMPILE_CHARGING_ONLY=1
# 显示：PW3 / Voyage / Oasis / PW4 都是 300 ppi（和系统镜像的默认一样），PW2 / 入门款 2019 在机型文件里改
LCD_DENSITY=300
KFB_ANIM_MODE=0           # 翻页动画只有 MTK 控制器有（epd.c g_is_mtk），i.MX EPDC 上不起作用
KFB_FLASH=8
KFB_SETTLE=50             # 单核 A9 帧间隔比 PW6 长，40 会在滑动中途就刷（判断值，未实测）
KFB_DITHER=3              # 4.1 的 PxP 硬件抖动；3.0 的抖动是内核里 CPU 做的，3.0 机型文件里关掉
