# Kindle Paperwhite 2（6 代，pinot，主板号 027/02A/02E/02F）：i.MX6SL 单核 A9，3.0.35，软浮点 5.12，256 MB，758x1024 212 ppi，cyttsp4 协议 B，无翻页键。
# 只写和 old-base.conf 不同的。
MODEL_ID=pw2
SOC=imx6sl
CPU_CORE=cortex-a9
CPU_CORES=1
RAM_MB=256
ZRAM_MB=160               # 压满约占 55 MB 实际内存
SWAPFILE_MB=256           # 用户分区上的交换文件（优先级低于 zram）；Kindle 自己开机就占约 228 MB
VM_VFS_CACHE_PRESSURE=150 # dentry / inode 缓存先于文件页回收
VM_MIN_FREE_KB=3072       # 256 MB：默认约 2 MB，不按 512 MB 机型给 4 MB
HEAP_START=4m             # 每个应用进程起步的堆少一半（堆上限 96m / 160m 是 memory.sh 按内存给的默认值）
PROC_LIMIT=2
MAX_STARTING_BG=1
APP_COMPILE=off           # dex2oat 编大应用要 150–250 MB，PW2 开着 Android 时可用 + 缓存一共约 150 MB
LCD_DENSITY=213           # 212 ppi：758 px = 569 dp（300 时只有 404 dp）
KFB_DITHER=0              # 3.0 的抖动是内核里 CPU 做的误差扩散
KFB_FLASH=6               # 波形大概率没有 REAGL（mode_version 24/25 才有）
KFB_SETTLE=60
TOUCH_EDGE_PX=85          # 边缘手势条 10 mm（212 ppi）
FL_COLD=max77696-bl       # /sys/class/backlight（KOReader 机型表）
FL_WARM=none
FL_LIPC0_DIM=1            # powerd 0 档仍亮，关灯另写 sysfs
