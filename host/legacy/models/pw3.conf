# Kindle Paperwhite 3（7 代，muscat，主板号 067/068/13G）：i.MX6SL 单核 A9，3.0.35，512 MB，1072x1448 300 ppi，cyttsp4 协议 B，无翻页键。
# 只写和 old-base.conf 不同的。
MODEL_ID=pw3
SOC=imx6sl
CPU_CORE=cortex-a9
CPU_CORES=1
RAM_MB=512
KFB_DITHER=0              # 3.0 的抖动是内核里 CPU 做的误差扩散
KFB_SETTLE=60
FL_COLD=max77696-bl       # /sys/class/backlight（KOReader 机型表）
FL_WARM=none
FL_LIPC0_DIM=1            # powerd 0 档仍亮，关灯另写 sysfs
