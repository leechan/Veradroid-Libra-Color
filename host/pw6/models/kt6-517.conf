# + cgroup freezer + binder. hostns() is therefore FALSE in the emulator kexec kernel,
# so 0.73 uses unshare (not the 5.17 chroot path used when /proc/self/ns/pid is missing).
# Real-device 5.17.1.0.4 stock kernel may still differ — confirm on first boot.
# Suspected white-screen causes (code, no QEMU yet):
#  1. display_prepare fallback defaults 1272x1696 (PW6) if FBInk/fb0 read fails
#  2. 5.17 zygote fd table ("Unsupported st_mode") — mitigated by libandroid_runtime.so in k49
#  3. binder node / unshare on 4.9.77 vs chroot (behavior split vs PW5 5.17 if stock lacks ns)
#  4. first frame never FULL-flushed on hwtcon_v2
# Do not claim a fix until kt6-517104 first-boot log + shot exist.
